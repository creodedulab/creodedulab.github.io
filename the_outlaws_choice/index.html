<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무법자의 선택 · The Outlaw’s Choice</title><link rel="stylesheet" href="style.css?v=10"></head>
<body><main><section class="artboard" id="scene" data-view="setup" aria-label="무법자의 선택">
<canvas id="game" width="1672" height="941" aria-label="서부 술집의 추첨 테이블"></canvas>
<div class="music-controls" role="group" aria-label="배경음악">
 <button class="music-icon" id="music-toggle" type="button" aria-label="배경음악" aria-pressed="true" title="배경음악 끄기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="speaker-waves" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/><path class="speaker-off" d="m16 10 5 5m0-5-5 5"/></svg></button>
 <details class="music-volume"><summary class="music-icon" aria-label="배경음악 음량 조절" title="음량 조절"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M9 3v6m6 0v6m-6 0v6"/></svg></summary><label class="volume-slider" for="music-volume">배경음악 음량<input id="music-volume" type="range" min="0" max="100" value="38"></label></details>
</div>
<form class="setup-panel" id="setup-form"><p class="eyebrow">THE TABLE IS YOURS</p><h1>운명의 범위를 정하세요</h1><div class="fields"><label>시작 번호<input id="minimum" type="number" min="1" max="9999" value="1" required></label><span>—</span><label>끝 번호<input id="maximum" type="number" min="1" max="9999" value="50" required></label></div>
<fieldset><legend>중복 추첨</legend><label><input type="radio" name="duplicates" id="unique" value="no" checked>중복 없이 뽑기</label><label><input type="radio" name="duplicates" id="repeat" value="yes">중복 허용</label></fieldset>
<div class="options"><label><input id="quick" type="checkbox">빠른 연출</label></div><p class="error" id="error" role="alert"></p><button class="start" id="start" type="submit" disabled>테이블 준비 중…</button></form>
<div class="action-frame" id="action-frame" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></div>
<nav class="play-toolbar" id="play-toolbar" aria-label="추첨 설정" hidden><p id="session-label"></p><button id="home" type="button">← 처음으로</button></nav>
</section><section class="play-footer" id="play-footer" hidden><button class="draw" id="draw" type="button" disabled>뽑기</button><ol id="history" aria-label="추첨 기록"></ol></section><p class="status" id="status" role="status" aria-live="polite">이미지를 불러오는 중…</p>
<footer class="copyright">© 2026 creodedulab</footer>
</main>
<audio id="music" src="assets/audio/dust-at-the-table.wav" preload="auto" loop></audio><script src="app.js?v=8"></script></body></html>
